<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-title" content="SpesenKit" />
    <meta name="theme-color" content="#356da8" />
    <meta
      name="description"
      content="SpesenKit · Dienstreisen · Spesen · Abrechnungen"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>SpesenKit</title>
  </head>
  <body>
    <div id="root">
      <main style="max-width:640px;margin:12vh auto;padding:24px;font-family:system-ui;color:#18211e" role="status">
        <h1>SpesenKit</h1>
        <p id="startup-status">SpesenKit wird gestartet … Falls dieser Hinweis bestehen bleibt, prüfen Sie Ihre Verbindung und laden Sie die Seite erneut. Ihre lokalen Daten bleiben erhalten.</p>
        <button type="button" onclick="location.reload()">Erneut laden</button>
        <noscript>Bitte aktivieren Sie JavaScript, um Ihre lokalen Reisekosten zu öffnen.</noscript>
      </main>
    </div>
    <script>
      window.addEventListener("error", function () {
        var status = document.getElementById("startup-status");
        if (status) status.textContent = "Die Anwendung konnte nicht geladen werden. Bitte prüfen Sie die Verbindung und laden Sie erneut. Ihre lokalen Daten bleiben erhalten.";
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
